{% extends "base.html" %}
{% block title %}Log ind – Narrativ Støtte{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Log ind</h1>

    <a href="{{ url_for('auth.google_login') }}" class="google-login-button">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="google-icon">
        Fortsæt med Google
    </a>

    <div class="auth-divider"><span>eller</span></div>

    <form method="POST" action="{{ url_for('auth.login_page') }}" class="auth-form">
        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required autocomplete="email"
                   placeholder="din@email.dk">
        </div>
        <div class="form-group">
            <label for="password">Kodeord</label>
            <input type="password" id="password" name="password" required autocomplete="current-password"
                   placeholder="Dit kodeord">
        </div>
        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="remember_me"> Husk mig
            </label>
        </div>
        <button type="submit" class="primary-action-button" style="width:100%;">Log ind</button>
    </form>

    <p style="text-align:center; margin-top:20px;">
        Ingen konto? <a href="{{ url_for('auth.register') }}">Opret bruger</a>
    </p>
</div>
{% endblock %}
